<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ربيع القلوب — Rabe3 Al-Quloob</title>
  <meta name="description" content="ربيع القلوب — تطبيق قرآني متكامل بـ 28 لغة" />
  <style>
    :root {
      --bg: #0a0f0d;
      --ink: #f5f1e8;
      --muted: #a8b5ad;
      --accent: #3d9b6e;
      --line: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Noto Naskh Arabic", sans-serif;
      background: radial-gradient(ellipse at top, rgba(61,155,110,0.2), transparent), var(--bg);
      color: var(--ink);
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 20px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: var(--muted); margin: 0 0 28px; line-height: 1.7; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 14px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s;
    }
    a:hover { transform: translateY(-2px); }
    .primary { background: var(--accent); color: #fff; }
    .ghost { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="card">
    <img src="rabe3/assets/rabea_brand_logo.webp" alt="ربيع القلوب" />
    <h1>ربيع القلوب</h1>
    <p>Rabe3 Al-Quloob — تطبيق قرآني متكامل بـ 28 لغة<br/>Your complete Quran companion in 28 languages</p>
    <div class="links">
      <a class="primary" href="rabe3/">صفحة المميزات — Features Page</a>
      <a class="ghost" href="privacy/">سياسة الخصوصية — Privacy Policy</a>
      <a class="ghost" href="app-ads.txt" target="_blank">app-ads.txt</a>
    </div>
  </div>
</body>
</html>
